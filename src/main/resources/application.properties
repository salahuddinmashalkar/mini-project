# AeroCast Application Configuration
server.port=${PORT:8080}
spring.application.name=AeroCast

# Embedded H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/aerocastdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Vaadin Flow Configuration
vaadin.launch-browser=false
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:true}
vaadin.eagerServerLoad=true

# Weather Engine & API Key Defaults from .env / System Environment
aerocast.groq-api-key=${GROQ_API_KEY:}
aerocast.openweather-api-key=${OPENWEATHER_API_KEY:}
aerocast.default-city=${AEROCAST_DEFAULT_CITY:Tokyo}
aerocast.default-country=${AEROCAST_DEFAULT_COUNTRY:Japan}
aerocast.default-unit=${AEROCAST_DEFAULT_UNIT:METRIC}
aerocast.cache-duration-minutes=30
